[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localclass"
version = "1.0.0"
description = "LocalClass — децентрализованный P2P-мессенджер и файлообменник для локальной сети"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "zeroconf>=0.130",
    "ifaddr>=0.2",
    "qrcode>=7.4",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6.6"]

[project.scripts]
localclass = "localclass.__main__:main"
localclass-node = "localclass.node:main"

[tool.setuptools.packages.find]
include = ["localclass*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
