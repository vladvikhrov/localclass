# Автосборка Windows-дистрибутива. Запускается на push в main, на тег v* (создаёт Release) и вручную.
#
# Сторонние actions закреплены по SHA коммита, а не по подвижному тегу: тег можно переставить на другой
# код, а SHA — нет. Версия в комментарии рядом; обновлять осознанно, сверяя changelog.
name: build-windows
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.12" }
      - name: Системные библиотеки для Qt (тесты интерфейса в offscreen-режиме)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    needs: test-linux
    permissions:
      contents: write      # нужно, чтобы шаг Release мог создать релиз и приложить установщик
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # На Windows проверяем платформозависимое: протокол, хранилище, передачу файлов и сессии.
      # Тесты интерфейса гоняются в job test-linux (логика Qt-слоя одинакова), а здесь важнее
      # smoke-тест настоящего exe ниже.
      - run: python -m pytest -q -ra tests/test_protocol.py tests/test_store.py tests/test_files.py tests/test_sessions.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean LocalClass.spec
      - name: Smoke-test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LocalClass\localclass-node.exe -ArgumentList "--device CI --port 5001 --data run\CI --no-repl --no-mdns" -PassThru
          Start-Sleep 8
          if ($p.HasExited) { throw "localclass-node.exe завершился с кодом $($p.ExitCode)" }
          Stop-Process $p
          Get-ChildItem run\CI\logs
      - name: Inno Setup
        shell: pwsh
        run: |
          $v = python -c "import localclass; print(localclass.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\LocalClass.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: LocalClass-setup          # единственный файл: установщик
          path: dist/LocalClass-*-setup.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/LocalClass-*-setup.exe
